[package]
name = "running-tracker-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
# Switched to native-tls for better cloud compatibility
sqlx = { version = "0.7.3", features = ["runtime-tokio-native-tls", "postgres", "chrono", "macros", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
fitparser = "0.7"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "multipart", "native-tls"] }
sha1 = "0.10"
polyline = "0.10"

# STRICT PINS for Rust 1.85 compatibility
home = "=0.5.11"
idna = "=0.5.0"
idna_adapter = "=1.2.0"
icu_collections = "=1.5.0"
icu_locid = "=1.5.0"
icu_properties = "=1.5.0"
icu_provider = "=1.5.0"
icu_normalizer = "=1.5.0"
